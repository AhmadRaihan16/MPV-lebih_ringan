# 🔥 PRESETS (Quick Combos)
# ═══════════════════════════════════════════════════════════════════════
# Clear All: Reset all VF filters and GLSL shaders at once
 F1                vf clr "" ; change-list glsl-shaders clr "" ; show-text "🧹 Clear All: VF Filters + Shaders Reset"   #! 🔥 Presets > 🧹 CLEAR ALL: VF + Shaders

#                                                                        #! 🔥 Presets > ---

# Preset 1: Run AI UAI first, then MEMC RIFE NV Fully automatic >24 fps will be downsampled (order matters!)
 F2                vf toggle vapoursynth="~~/vs/MIX_UAI_RIFE_NV_TRT_COMBO_AUTOMATIC.vpy" ; show-text "🔥 Preset 1: Downsampling 24fps + AI UAI + MEMC RIFE"   #! 🔥 Presets > 🔥 Preset 1: Downsampling 24fps + AI UAI + MEMC RIFE

# Preset 2: Run AI UAI first, then MEMC RIFE NV (order matters!)
 F3                vf clr "" ; vf add vapoursynth="~~/vs/MIX_UAI_NV_TRT.vpy" ; vf add vapoursynth="~~/vs/MEMC_RIFE_NV.vpy" ; show-text "🔥 Preset 2: AI UAI + MEMC RIFE Activated"   #! 🔥 Presets > 🔥 Preset 2: AI UAI + MEMC RIFE

# Preset 3: A4K_ConfigQ + RIFE 3X
 F4                vf clr "" ; change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_AIO_optQ.glsl" ; vf add vapoursynth="~~/vs/MEMC_RIFE_NV_3X.vpy" ; show-text "🔥 Preset 3: A4K_ConfigQ + RIFE 3X Activated"   #! 🔥 Presets > 🔥 Preset 3: A4K_ConfigQ + RIFE 3X

# Preset 4: Anime4K Restore + RIFE 3X
 F5                vf clr "" ; change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Restore_CNN_L.glsl" ; vf add vapoursynth="~~/vs/MEMC_RIFE_NV_3X.vpy" ; show-text "🔥 Preset 4: Anime4K Restore + RIFE 3X Activated"   #! 🔥 Presets > 🔥 Preset 4: Anime4K Restore + RIFE 3X

