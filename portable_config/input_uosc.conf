 2                 add contrast  1                                       #! 🎥 Video > 🎚️ Equalizer > Contrast +
 3                 add brightness -1                                     #! 🎥 Video > 🎚️ Equalizer > Brightness -
 4                 add brightness  1                                     #! 🎥 Video > 🎚️ Equalizer > Brightness +
 5                 add gamma -1                                          #! 🎥 Video > 🎚️ Equalizer > Gamma -
 6                 add gamma  1                                          #! 🎥 Video > 🎚️ Equalizer > Gamma +
 7                 add saturation -1                                     #! 🎥 Video > 🎚️ Equalizer > Saturation -
 8                 add saturation  1                                     #! 🎥 Video > 🎚️ Equalizer > Saturation +
 9                 add hue -1                                            #! 🎥 Video > 🎚️ Equalizer > Hue -
 0                 add hue  1                                            #! 🎥 Video > 🎚️ Equalizer > Hue +
