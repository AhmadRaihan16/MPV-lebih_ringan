#                  script-binding uosc/open-file                         #! 📥 Load > 📁 File Browser
 Ctrl+Shift+v      loadfile ${clipboard/text}                            #! 📥 Load > 📋 Clipboard URL
#                  script-binding uosc/load-subtitles                    #! 📥 Load > 📜 Import Subtitle

#                  script-binding uosc/playlist                          #! 🧭 Navigation > 📃 Playlist
#                  script-binding uosc/editions                          #! 🧭 Navigation > 📚 Edition List
#                  script-binding uosc/chapters                          #! 🧭 Navigation > 📖 Chapter List
#                  script-binding uosc/video                             #! 🧭 Navigation > 🎥 Video Track List
#                  script-binding uosc/audio                             #! 🧭 Navigation > 🔊 Audio Track List
#                  script-binding uosc/subtitles                         #! 🧭 Navigation > 📜 Subtitle Track List
#                  playlist-shuffle                                      #! 🧭 Navigation > 🔀 Shuffle Playlist

 ,                 frame-back-step                                       #! ⏯️ Playback > ⏪ Previous Frame
 .                 frame-step                                            #! ⏯️ Playback > ⏩ Next Frame
 l                 ab-loop                                               #! ⏯️ Playback > 🔁 Set/Clear AB-Loop
 [                 no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-elements speed   #! ⏯️ Playback > 🐢 Decrease Speed
 ]                 no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-elements speed   #! ⏯️ Playback > 🐇 Increase Speed
 {                 no-osd add speed -0.1 ; script-message-to uosc flash-elements speed                   #! ⏯️ Playback > 🐌 Adjust Speed -0.1
 }                 no-osd add speed  0.1 ; script-message-to uosc flash-elements speed                   #! ⏯️ Playback > 🚀 Adjust Speed +0.1
 -                 no-osd add volume -1 ; script-message-to uosc flash-elements volume                   #! ⏯️ Playback > 🔉 Decrease Volume
 =                 no-osd add volume  1 ; script-message-to uosc flash-elements volume                   #! ⏯️ Playback > 🔊 Increase Volume
#                  ignore                                                #! ⏯️ Playback > ---
 c                 add audio-delay -0.1                                  #! ⏯️ Playback > ⏪ Advance Audio 100ms
 v                 add audio-delay  0.1                                  #! ⏯️ Playback > ⏩ Delay Audio 100ms
 z                 add sub-delay -0.1                                    #! ⏯️ Playback > ⏪ Advance Subtitle 100ms
 x                 add sub-delay +0.1                                    #! ⏯️ Playback > ⏩ Delay Subtitle 100ms
#                  ignore                                                #! ⏯️ Playback > ---
 Shift+BS          set audio-delay 0 ; set sub-delay 0                   #! ⏯️ Playback > 🔄 Reset Sync

