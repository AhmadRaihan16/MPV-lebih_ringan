## This file only demonstrates the binding syntax involving list options
## View the enabled list of vf/af on page 1 of the default (Shift+)I key, page 2 is the GLSL/hook loading list
## Any shaders and filters can be set to auto-load mode without manual loading each time,
## see the "Scripts Filters Shaders" section in mpv.conf


################
## Shader List ##
################

## For detailed descriptions of third-party shaders, see: https://hooke007.github.io/unofficial/mpv_shaders.html

## Toggle single shader: KrigBilateral (slower, advanced chroma reconstruction, extremely high quality but subtle visual impact)
 Ctrl+1               change-list glsl-shaders toggle "~~/shaders/KrigBilateral.glsl"
## Toggle single shader: AMD_FSR1_EASU (very fast, upscales to target resolution)
 Ctrl+2               change-list glsl-shaders toggle "~~/shaders/AMD/AMD_FSR1_EASU.glsl"
## Toggle single shader: RAVUzr2 (moderate speed, upscales to target resolution, slight sharpening)
 Ctrl+3               change-list glsl-shaders toggle "~~/shaders/RAISR/ravu_zoom_r2.glsl"
## Toggle single shader: Anime4K_Restore_CNN_M (fast, no scaling, line reconstruction)
 Ctrl+4               change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl"
## Toggle single shader: Anime4K_Upscale_GAN_x2_M (fast, 2x upscale, slightly strong visual impact)
 Ctrl+5               change-list glsl-shaders toggle "~~/shaders/Anime4K/Anime4K_Upscale_GAN_x2_M.glsl"
## Toggle single shader: FSRCNNX8041 (slower, 2x upscale, relatively faithful to original image)
 Ctrl+6               change-list glsl-shaders toggle "~~/shaders/FSRCNNX/FSRCNNX_x2_8_0_4_1.glsl"
## Toggle single shader: Adaptive Sharpen (moderate speed, no scaling)
 Ctrl+7               change-list glsl-shaders toggle "~~/shaders/Adaptive_sharpen/Adaptive_sharpen_RT.glsl"
## Toggle single shader: nnedi3_nns64_win8x4 (very slow, 2x upscale, faithful to original image)
 Ctrl+8               change-list glsl-shaders toggle "~~/shaders/EDI/nnedi3_nns64_win8x4.glsl"

## Clear and load shader combination: Anime4K "DTDD"
## (relatively fast, no scaling, darken lines + thin lines + median denoise + Gaussian deblur, strong subjective impact)
 Ctrl+9               change-list glsl-shaders set "~~/shaders/Anime4K/Anime4K_Darken_HQ.glsl;~~/shaders/Anime4K/Anime4K_Thin_HQ.glsl;~~/shaders/Anime4K/Anime4K_Denoise_Bilateral_Mode.glsl;~~/shaders/Anime4K/Anime4K_Deblur_DoG.glsl"
## Clear and load shader combination: Dual SSIM (moderate speed, assists built-in algorithm for upscaling/downscaling)
 Ctrl+0               change-list glsl-shaders set "~~/shaders/SSim/SSimSuperRes_RT.glsl;~~/shaders/SSim/SSimDownscaler_RT.glsl"

## Clear all loaded shaders
 Ctrl+`               change-list glsl-shaders clr ""                    # Clear list — Video shaders


################
## Filter List ##
################

## Many filters do not support pure hardware decoding without -copy (i.e. hwdec=xxxx).
## It is recommended to use hwdec=no or hwdec=xxxx-copy for better compatibility.
## For other unlisted solutions, add/modify as needed.
## For detailed filter syntax, see: https://hooke007.github.io/unofficial/mpv_filters.html

## VapourSynth frame interpolation scripts: only one can be active at a time.
## Disable others before enabling a new one.

## Toggle: mvtools frame interpolation — Solution 1  <Shift+1>
 !                    vf toggle vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"       # Toggle mvtools frame interpolation (Fast)
## Toggle: RIFE frame interpolation — NVIDIA TensorRT  <Shift+2>
 @                    vf toggle vapoursynth="~~/vs/MEMC_RIFE_NV.vpy"      # Toggle RIFE frame interpolation (NVIDIA)
## Toggle: RIFE frame interpolation — DirectML (any GPU)  <Shift+3>
 SHARP                vf toggle vapoursynth="~~/vs/MEMC_RIFE_DML.vpy"     # Toggle RIFE frame interpolation (DirectML)
## Toggle: svpflow frame interpolation — Solution 2  <Shift+4>
 $                    vf toggle vapoursynth="~~/vs/MEMC_SVP_PRO.vpy"      # Toggle svpflow frame interpolation (Pro)
## Toggle: RIFE frame interpolation  <Shift+5>
 %                    vf toggle vapoursynth="~~/vs/MEMC_RIFE_STD.vpy"     # Toggle RIFE frame interpolation

## Force source color range to limited (16-235).
## Some sources have incorrect color range marking after compression
## (e.g., pure black appears gray, or pure white base appears green).  <Shift+6>
 ^                    vf toggle format=colorlevels=limited                 # Toggle: mark dynamic range as limited

## Add black bars to pad source to 16:9 (useful for 2.35:1 sources with 16:9 subtitles)  <Shift+7>
 &                    vf toggle pad=aspect=16/9:x=-1:y=-1                  # Toggle: pad black bars to 16:9 and center source

## Image rotation  <Shift+8>  <Shift+9>  <Shift+0>
 *                    vf toggle rotate=angle=180*PI/180                    # Toggle: rotate image 180°
 (                    vf toggle vflip                                      # Toggle: vertical flip
 )                    vf toggle hflip                                      # Toggle: horizontal flip

## Apply gamma correction to 2.2 (useful for post-calibration adjustment).
## Default ICC correction targets BT.1886 curve.  <Shift+->
 _                    vf toggle format=gamma=gamma2.2                      # Toggle: gamma correction 2.2

## Super deinterlacing (QTGMC)  <Shift+=>
 +                    vf toggle vapoursynth="~~/vs/ETC_DEINT_EX.vpy"       # Toggle: QTGMC deinterlacing

## Clear all active video filters  <Shift+`>
 ~                    vf clr ""                                            # Clear list — Video filters
