### mpv.conf Optimized for Lenovo LOQ (RTX 4060 Laptop GPU)
### Monitor  : 1080p SDR 75Hz
### Content  : Anime, Live Action, Western Animation
### Updated  : 2026 (v4 Audio EQ, UI Scripts, Subtitle Fix)

input-conf = "~~/input_uosc.conf"
include    = "~~/profiles.conf"
include    = "~~/script-opts.conf"
use-filedir-conf = yes


########
# Basic #
########

vo      = gpu-next
gpu-api = d3d11

d3d11-adapter = NVIDIA

hwdec        = d3d11va-copy
hwdec-codecs = h264,hevc,vp8,vp9,av1,ffv1


############
# Features #
############

idle                   = no
force-window           = no
geometry               = 1280x720+200+100
snap-window            = no
title                  = AZ-MPV - ${?media-title:${media-title}}${!media-title:${filename}}
input-ime              = no
input-builtin-bindings = no

hr-seek-framedrop      = no
save-position-on-quit  = yes
watch-later-options    = start,vid,aid,sid

cache                  = yes
demuxer-readahead-secs = 30
prefetch-playlist      = yes
demuxer-max-bytes      = 4096MiB
demuxer-max-back-bytes = 2048MiB

target-colorspace-hint = yes
d3d11-output-format    = auto
directory-mode         = ignore

keep-open              = yes
autofit-smaller        = 50%x50%
keepaspect-window      = no
hidpi-window-scale     = no

icc-cache-dir          = "~~/_cache/icc"
gpu-shader-cache-dir   = "~~/_cache/shader"
watch-later-dir        = "~~/_cache/watch_later"


#######
# OSD #
#######

osd-on-seek               = msg
osd-bar-w                 = 100
osd-bar-h                 = 1.8
osd-bar-align-y           = -1
osd-color                 = "#672168"
osd-outline-color         = "#EEEEEE"
osd-outline-size          = 0.8
osd-font-size             = 34
osd-fractions             = yes
osd-playing-msg           = "${filename}"
osd-duration              = 2000
osd-playing-msg-duration  = 3000


########
# Audio #
########

ao              = wasapi
volume          = 100
volume-max      = 130
audio-channels  = stereo
audio-file-auto = fuzzy

# Audio Pipeline: Loudness Normalization + Dialog EQ
#
# Chain (left to right):
#   1. loudnorm  : LUFS normalization. Quiet scenes aren't too soft, loud scenes don't explode.
#   2. eq 300Hz  : Slight cut at 300Hz. Removes boxy or muddy sound in dialogue.
#   3. eq 1500Hz : Boost at 1.5kHz. Core human vocal frequency to bring dialogue forward.
#   4. eq 3500Hz : Boost at 3.5kHz. Articulation range for clearer consonants. Great for IEMs.
#
# All values are optimized for IEMs and external speakers.
# Lower g= at eq 3500Hz from 2 to 1 if it sounds too bright on IEMs.
#
af = lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11,equalizer=f=300:width_type=o:width=1:g=-2,equalizer=f=1500:width_type=q:width=1.5:g=3,equalizer=f=3500:width_type=q:width=1.5:g=2]


########
# Video #
########

# Motion & Sync (75Hz optimized)
video-sync      = display-resample
interpolation   = yes
tscale          = oversample
tscale-blur     = 0.65
opengl-swapinterval = 0

# Color SDR Output
icc-profile-auto       = yes
gamma-factor           = 1.0
gamut-mapping-mode     = perceptual
target-colorspace-hint = no

# Vibrance boost
saturation = 8

# Scaling
scale               = ewa_lanczossharp
cscale              = ewa_lanczossharp
dscale              = mitchell
scale-antiring      = 0.6
cscale-antiring     = 0.6
sigmoid-upscaling   = yes
correct-downscaling = yes

# Dithering
dither-depth = auto
dither       = fruit

# Deband
deband            = yes
deband-iterations = 3
deband-threshold  = 35
deband-range      = 16
deband-grain      = 6

# FBO
fbo-format  = rgba16hf
deinterlace = auto


##############################
# Shaders (Global Default)   #
##############################

# KrigBilateral: chroma upscaling
glsl-shaders-append = "~~/shaders/KrigBilateral.glsl"

osc = no
ytdl-raw-options-append = sub-langs=-danmaku
# background-blur-radius  = 8  # disabled: causes invisible/transparent window when no video is playing


###########
# Scripts #
###########

# thumbfast
script-opts-append = thumbfast-network=no
script-opts-append = thumbfast-cache_dir=~~/_cache/thumbfast
script-opts-append = thumbfast-max_height=200
script-opts-append = thumbfast-max_width=360
script-opts-append = thumbfast-spawn_first=yes


#############
# Subtitles #
#############

sub-auto              = fuzzy
sub-file-paths        = sub;Subs;subtitles
sub-codepage          = GB18030
slang                 = id,ind,in,indonesia,id-ID
# secondary-slang       = eng,en,en-US
subs-fallback         = yes
sub-hdr-peak          = 100

# Subtitle Font Style
sub-font              = "Ubuntu"
sub-bold              = yes
sub-font-size         = 30
sub-color             = "#FFFFFF"
sub-outline-color     = "#000000"
sub-outline-size      = 3
sub-blur              = 1
sub-scale-signs       = yes

# Automatic Black Bar Position
sub-use-margins       = yes
sub-ass-force-margins = yes
sub-ass-override      = no
sub-margin-y          = 10

image-subs-hdr-peak   = 10000

# Soia-like Features
sub-auto              = fuzzy
secondary-sid         = no

##############
# Screenshots #
##############

screenshot-format          = png
screenshot-jpeg-quality    = 100
screenshot-png-compression = 4
screenshot-webp-lossless   = yes
screenshot-jxl-distance    = 0
screenshot-tag-colorspace  = no
screenshot-high-bit-depth  = no
screenshot-template        = "~~desktop/MPV-%P-N%n"


##################################
# Performance Tuning (RTX 4060)  #
##################################

d3d11-flip          = yes
d3d11-sync-interval = 1


#######################
# Auto-Load Profiles  #
#######################

# ============================================================================
# PROFILE: HDR & Dolby Vision
# ============================================================================
[HDR]
profile-cond    = get("video-params/primaries") == "bt.2020" and (get("video-params/gamma") == "pq" or get("video-params/gamma") == "hlg")
profile-restore = copy

glsl-shaders-clr
glsl-shaders-append = "~~/shaders/KrigBilateral.glsl"
target-colorspace-hint = yes
target-prim            = auto
target-trc             = auto
target-peak            = auto
contrast = 0
brightness = 0
saturation = 0

# Audio pipeline
af = lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11,equalizer=f=300:width_type=o:width=1:g=-2,equalizer=f=1500:width_type=q:width=1.5:g=3,equalizer=f=3500:width_type=q:width=1.5:g=2]


# ============================================================================
# PROFILE: SDR to Fake HDR
# ============================================================================
[SDR-to-HDR]
profile-cond    = not (get("video-params/primaries") == "bt.2020" and (get("video-params/gamma") == "pq" or get("video-params/gamma") == "hlg"))
profile-restore = copy
glsl-shaders-append = "~~/shaders/FX_FAKE_HDR_v2.glsl"


# ============================================================================
# PROFILE: Anime
# ============================================================================
[Anime]
profile-cond    = string.find(string.lower(get("filename", "")), "anime") ~= nil
profile-restore = copy

deband            = yes
deband-iterations = 4
deband-threshold  = 35
deband-range      = 20
deband-grain      = 12

glsl-shaders-clr
glsl-shaders-append = "~~/shaders/KrigBilateral.glsl"
# glsl-shaders-append = "~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl"
# glsl-shaders-append = "~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl"
# glsl-shaders-append = "~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl"
# glsl-shaders-append = "~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl"
# glsl-shaders-append = "~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x4.glsl"


# ============================================================================
# PROFILE: Live Action & Film
# ============================================================================
[LiveAction]
profile-cond    = string.find(string.lower(get("filename", "")), "web%-dl") ~= nil or string.find(string.lower(get("filename", "")), "webrip") ~= nil or string.find(string.lower(get("filename", "")), "bluray") ~= nil or string.find(string.lower(get("filename", "")), "bdrip") ~= nil
profile-restore = copy

glsl-shaders-clr
glsl-shaders-append = "~~/shaders/KrigBilateral.glsl"
glsl-shaders-append = "~~/shaders/SSim/SSimSuperRes_RT.glsl"
glsl-shaders-append = "~~/shaders/SSim/SSimDownscaler_RT.glsl"

contrast = 3


# ============================================================================
# PROFILE: IEM
# ============================================================================
[IEM]
af-append = lavfi=[equalizer=f=8000:width_type=o:width=1:g=-1.5,equalizer=f=12000:width_type=o:width=1:g=-1]


# ============================================================================
# PROFILE: External Speaker
# ============================================================================
[Speaker]
af-append = lavfi=[equalizer=f=80:width_type=o:width=1:g=3,equalizer=f=150:width_type=o:width=1:g=2]


# ============================================================================
# PROFILE: Battery Saver
# ============================================================================
[Battery]
profile-cond    = get("battery") == true
profile-restore = copy
hwdec           = d3d11va
scale           = bilinear
cscale          = bilinear
deband          = no
interpolation   = no
glsl-shaders-clr